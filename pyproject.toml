
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pelicun"
version = "3.10.0.dev0"
description = "Probabilistic Estimation of Losses, Injuries, and Community resilience Under Natural hazard events"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Adam Zsarnóczay", email = "adamzs@stanford.edu"}
]
classifiers = [
    "Programming Language :: Python",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23, <3.0",
    "scipy>=1.8.0, <1.16",
    "pandas>=2.2.3, <3.0",
    "colorama>=0.4.0, <0.5.0",
    "numexpr>=2.8, <3.0",
    "jsonschema>=4.22.0, <5.0",
    "tqdm>=4.60.0, <5.0",
    "requests>=2.28.0, <3.0",
    "joblib>=1.2.0, <2.0",
    "scikit-learn>=1.0.0, <2.0",
    "packaging>=23.0, <27.0"
]

[project.optional-dependencies]
test = [
    "glob2",
    "pytest",
    "pytest-cov",
    "pytest-httpserver",
    "pytest-socket",
    "pytest-xdist",
]
lint = [
    "codespell",
    "mypy",
    "pandas-stubs",
    "ruff==0.7.0",
    "types-colorama",
]
doc = [
    "jupyter",
    "jupytext",
    "nbsphinx",
    "numpydoc",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx_design",
    "sphinxcontrib-bibtex",
]
development = [
    "pelicun[test,lint,doc]",
]

[project.scripts]
pelicun = "pelicun.cli:main"

[project.urls]
Homepage = "http://nheri-simcenter.github.io/pelicun/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pelicun*"]
exclude = ["doc_src*"]

[tool.ruff]
line-length = 85
# Keep lint behavior as it was before `requires-python` was added Bumping this
# activates UP035 and others on existing code.
target-version = "py38"
exclude = [
  "rulesets",
  "examples",
  "*.ipynb",
  ".venv*",
  "pelicun/tests/dl_calculation/e7/auto_HU_NJ.py",
  "pelicun/tests/dl_calculation/e8/auto_HU_LA.py",
  "pelicun/tests/dl_calculation/e9/custom_pop.py",
  "pelicun/resources/DamageAndLossModelLibrary/"
]

[tool.ruff.lint]
# Enable all known categories
select = ["ALL"]
ignore = [
  "ANN101",
  "D211",
  "D212",
  "Q000",
  "Q003",
  "COM812",
  "D203",
  "ISC001",
  "E501",
  "ERA001",
  "PGH003",
  "FIX002",
  "TD003",
  "S101",
  "N801",
  "S311",
  "G004",
  "SIM102",
  "SIM108",
  "NPY002",
  "F401",
  "TRY003"
]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args=15
max-locals=50
max-returns=11
max-branches=50
max-statements=150
max-bool-expr=5

[tool.ruff.lint.per-file-ignores]
"pelicun/tests/*" = ["D", "N802", "SLF001", "PLR2004", "PLR6301"]
"pelicun/resources/auto/*" = ['PLR', 'T', 'N', 'ANN', 'D', 'PTH', 'INP', 'DOC', 'RET', 'TD']
"pelicun/tools/HDF_to_CSV.py" = ["ALL"]
"pelicun/tests/validation/inactive/*" = ["T201", "B018", "ANN", "PD"]
"pelicun/tests/dl_calculation/rulesets/*" = ["N999"]
"pelicun/tests/dl_calculation/e9/CustomDLModels/*" = ["ALL"]
"doc/source/examples/notebooks/*" = ["INP001", "CPY001", "D400", "B018", "F821", "T201", "T203", "F404", "E402"]

[tool.ruff.format]
quote-style = "single"

[tool.codespell]
ignore-words = ["ignore_words.txt"]
skip = [
  "*.html",
  "*.ipynb",
  "./htmlcov/*",
  "./doc_src/build/*",
  "./pelicun.egg-info/*",
  "./doc_src/*",
  "./doc/build/*",
  "./doc/_build/*",
  "*/rulesets/*",
  "custom_pop.py",
  "*/SimCenterDBDL/*",
  "auto_HU_NJ.py",
  "auto_HU_LA.py",
  "custom_pop.py",
  "*/resources/DamageAndLossModelLibrary/*"]

[tool.pytest.ini_options]
socket_disabled_by_default = true

[tool.mypy]
ignore_missing_imports = true
exclude = ".*/resources/DamageAndLossModelLibrary/.*"
namespace_packages = false
