# Version updates stay off (open-pull-requests-limit: 0; security
# updates are exempt from that limit). The allow rule limits
# security-update pull requests to production dependencies.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "production"
