# .github/workflows/ci.yml
name: Pelicun CI/CD

on:
  push:
  pull_request:
  release:
    types: [created]

# Least privilege: CI only reads the checkout. deploy_to_pypi elevates its own
# permissions for trusted publishing.
permissions:
  contents: read

# Cancel superseded runs of the same ref (e.g. rapid pushes to a PR). The
# event name is part of the group and release runs are never auto-canceled,
# so a tag-push run can neither cancel nor be canceled by the release run
# that publishes to PyPI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  # Pin uv so CI matches the committed uv.lock resolver and the local dev version.
  UV_VERSION: '0.10.9'

jobs:
  # ----- STAGE 1: STATIC CHECKS -----
  checks:
    name: Lint, Format, and Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - name: Sync environment
        run: uv sync --locked --extra test --extra lint
      - name: Ruff lint
        run: uv run --no-sync ruff check
      - name: Ruff format check
        run: uv run --no-sync ruff format --check
      - name: Spell check
        run: uv run --no-sync codespell

  # ----- STAGE 2: TESTS AND DOCS -----
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests
        run: uv run --locked --extra test python -m pytest --cov=pelicun --cov-report xml pelicun/tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs_check:
    name: Check Sphinx Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Sync environment
        run: uv sync --locked --extra doc
      - name: Check for Sphinx warnings
        run: uv run --no-sync sphinx-build -M html ./doc/source ./doc/_build --fail-on-warning

  # ----- STAGE 3: DEPLOYMENT -----
  deploy_to_pypi:
    name: Deploy to PyPI
    if: github.event_name == 'release' && github.event.action == 'created'
    needs: [checks, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
      - name: Build the sdist and wheel
        run: uv build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
